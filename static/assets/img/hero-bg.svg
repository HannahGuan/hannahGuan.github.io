<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- hand-cut paper edges -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>
    <!-- paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0.5 0"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="#f4eee4"/>

  <g filter="url(#rough)">
    <!-- sun -->
    <circle cx="1160" cy="112" r="62" fill="#ecc9a6" opacity="0.85"/>

    <!-- far hills -->
    <path d="M-20 262 C150 196 300 188 430 250 S650 352 800 362 S1050 332 1180 262 S1450 178 1620 232 L1620 440 L-20 440Z" fill="#c9d5d6"/>
    <!-- middle hills -->
    <path d="M-20 318 C120 268 260 262 380 322 S600 402 800 398 S1080 382 1240 322 S1480 268 1620 300 L1620 440 L-20 440Z" fill="#b9c4a8"/>
    <!-- near mounds -->
    <path d="M-20 372 C90 338 240 348 420 440 L-20 440Z" fill="#dcae97"/>
    <path d="M1180 440 C1340 356 1500 348 1620 374 L1620 440Z" fill="#dcae97"/>

    <!-- trees -->
    <g fill="#4a626b" transform="translate(110 8)">
      <rect x="176" y="236" width="7" height="52" rx="3"/>
      <path d="M180 150 C214 152 232 186 226 214 C221 240 198 252 178 250 C154 248 136 228 136 202 C136 172 154 149 180 150Z"/>
    </g>
    <g fill="#7f9176" transform="translate(110 26)">
      <rect x="262" y="262" width="5" height="34" rx="2"/>
      <path d="M265 206 C286 208 296 230 292 248 C288 264 276 270 264 269 C249 268 239 255 240 239 C241 221 250 205 265 206Z"/>
    </g>

    <!-- cats -->
    <g fill="#4a626b" transform="translate(1250 256)">
      <path d="M0 62 C-5 32 5 10 22 10 C39 10 47 32 45 62Z"/>
      <circle cx="21" cy="3" r="12.5"/>
      <path d="M9 -3 L11 -19 L20 -8Z M23 -8 L31 -19 L33 -3Z"/>
      <path d="M42 57 C64 60 73 44 63 31" fill="none" stroke="#4a626b" stroke-width="5.5" stroke-linecap="round"/>
    </g>
    <g fill="#8b6f62" transform="translate(1322 270)">
      <path d="M0 38 C-3 18 6 6 26 6 C46 6 56 18 54 38Z"/>
      <circle cx="6" cy="8" r="10.5"/>
      <path d="M-4 3 L-3 -11 L5 -1Z M7 -2 L14 -11 L16 2Z"/>
    </g>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#4a626b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" transform="translate(120 -10)">
    <path d="M330 96 q9 -10 18 0 q9 -10 18 0"/>
    <path d="M392 128 q7 -8 14 0 q7 -8 14 0"/>
    <path d="M300 140 q6 -7 12 0 q6 -7 12 0"/>
  </g>

  <rect width="1600" height="420" filter="url(#grain)" opacity="0.10"/>
</svg>
